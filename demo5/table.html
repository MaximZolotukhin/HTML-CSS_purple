<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

<body>
  <table>
    <caption>Таблица расходов и доходов</caption>

        <th>Год</th>
        <th colspan="2">2023</th>
        <th colspan="2">2024</th>
      </tr>
      <tr>
        <th>Полугодие</th>
        <th>1</th>
        <th>2</th>
        <th>1</th>
        <th>2</th>
      </tr>
    </thead>

      <tr>
        <td>Доход</td>
        <td>1500000</td>
        <td>1800000</td>
        <td>2000000</td>
        <td>3000000</td>
      </tr>

        <td>Расход</td>
        <td>-500000</td>
        <td>-600000</td>
        <td>-700000</td>
        <td>-1000000</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td>Итог</td>
        <td>1000000</td>
        <td>1200000</td>
        <td>1300000</td>
        <td>2000000</td>
      </tr>
    </tfoot>
  </table>
